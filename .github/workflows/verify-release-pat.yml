name: Verify RELEASE_PAT

# TEMPORARY — delete once the token is validated.
#
# Creates a *draft* release with RELEASE_PAT and deletes it again. A draft does
# not fire `on: release: [published]`, so publish.yml stays asleep and nothing
# reaches PyPI. This exercises exactly the permissions release.yml needs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Secret present?
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_PAT is empty or not set."
            exit 1
          fi
          echo "RELEASE_PAT is set (${#RELEASE_TOKEN} characters)."

      - name: Repository write access?
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          PUSH=$(gh api repos/${{ github.repository }} --jq '.permissions.push')
          echo "push access: ${PUSH}"
          [ "${PUSH}" = "true" ] || { echo "::error::the token has no push access"; exit 1; }

      - name: Create a draft release on the default branch HEAD
        id: plain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          gh release create pat-smoke-plain \
            --repo ${{ github.repository }} \
            --draft --notes "RELEASE_PAT verification — safe to delete" \
            --title "pat-smoke-plain"
          echo "OK: draft release created on the default branch."

      # The REST docs warn that creating a release 404s when the target commit
      # adds or modifies a file under .github/workflows/ and the token lacks the
      # "Workflows" permission. Point a draft at such a commit to find out
      # whether this flow really needs that permission.
      - name: Create a draft release on a workflow-touching commit
        id: workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          SHA=$(git -C . rev-parse HEAD 2>/dev/null || echo "")
          gh release create pat-smoke-workflows \
            --repo ${{ github.repository }} \
            --target "${{ github.sha }}" \
            --draft --notes "RELEASE_PAT verification — safe to delete" \
            --title "pat-smoke-workflows"
          echo "OK: draft release created on a workflow-touching commit."

      - name: Clean up
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          for tag in pat-smoke-plain pat-smoke-workflows; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes 2>/dev/null \
              && echo "deleted draft $tag" || true
          done

      - name: Verdict
        run: |
          echo "plain draft      : ${{ steps.plain.outcome }}"
          echo "workflow-target  : ${{ steps.workflows.outcome }}"
          if [ "${{ steps.plain.outcome }}" != "success" ]; then
            echo "::error::the token cannot create a release — check Contents: Read and write"
            exit 1
          fi
          if [ "${{ steps.workflows.outcome }}" != "success" ]; then
            echo "::warning::releases on workflow-touching commits fail — add the Workflows: Read and write permission"
            exit 1
          fi
          echo "RELEASE_PAT is correctly configured."
