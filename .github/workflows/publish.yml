name: Publish — All Channels

on:
  release:
    types: [published]
  # Dry run: build and smoke-test the binaries without publishing anything.
  # Every publishing job below is gated on `github.event_name == 'release'`,
  # so a manual run exercises the pipeline and stays inert. The release
  # binaries had been broken for three releases precisely because the only
  # way to run this file was to cut a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to name the artifacts after (default: pyproject version)"
        required: false
        default: ""

permissions:
  contents: write        # needed for uploading release assets
  packages: write        # needed for GHCR
  id-token: write        # trusted publishing (PyPI)

env:
  # Empty on workflow_dispatch unless a tag is given; the version job falls
  # back to the version pyproject.toml declares.
  VERSION_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # ── Extract version ──────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          set -euo pipefail
          if [ -n "${VERSION_TAG:-}" ]; then
            echo "version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
            echo "::notice::dry run — naming artifacts after pyproject version $V"
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

  # ── Which packaging targets actually ship in the repo? ───────────
  # npm/, snap/ and vscode-extension/ are absent, so on a fresh checkout their
  # jobs would fail. Skip them instead of turning the release red, and say
  # which ones were skipped.
  #
  # The Homebrew/Scoop/Winget templates used to live under dist/, which is
  # gitignored as a build-output directory — so they were never committed and
  # these checks always reported false on a CI checkout. They now live in
  # packaging/, which is tracked.
  packaging:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.p.outputs.npm }}
      snap: ${{ steps.p.outputs.snap }}
      vscode: ${{ steps.p.outputs.vscode }}
      homebrew: ${{ steps.p.outputs.homebrew }}
      manifests: ${{ steps.p.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          set -euo pipefail
          emit() {
            if [ -d "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$2 is not in the repository — skipping the $1 publish job."
            fi
          }
          emit npm npm
          emit snap snap
          emit vscode vscode-extension
          emit homebrew packaging/homebrew
          emit manifests packaging/scoop

  # ── 1. PyPI ──────────────────────────────────────────────────────
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-python
          path: dist/

  publish-pypi:
    needs: build-python
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/demodsl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-python
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── 2. npm ───────────────────────────────────────────────────────
  publish-npm:
    needs: [publish-pypi, version, packaging]
    if: github.event_name == 'release' && needs.packaging.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 3. Docker (GHCR) ────────────────────────────────────────────
  publish-docker:
    needs: [publish-pypi, version]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `github.repository` keeps the owner's original casing (Fran-cois), but
      # Docker refuses a tag whose repository name is not lowercase:
      #   invalid tag "ghcr.io/Fran-cois/demodsl:3.7.0":
      #   repository name must be lowercase
      # This silently failed every release, including 3.6.1 and 3.7.0.
      - id: image
        run: |
          # `${VAR,,}` would need bash 4+; `tr` works on every runner and
          # can be verified locally.
          LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${LC}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Standalone binaries (PyInstaller) ─────────────────────────
  build-binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          # `macos-13` was retired by GitHub: a job requesting a label that no
          # longer exists queues until the 24 h timeout instead of failing, and
          # `upload-release-assets` waits on the whole matrix — so no release
          # ever got its binaries attached (3.6.1 died at exactly 24h00m08s).
          # `macos-15-intel` is the current Intel label.
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # A runner label that cannot be scheduled should surface in minutes, not
    # after a day of a silently "queued" job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller
        run: |
          pip install . pyinstaller
      - name: Build binary
        run: pyinstaller demodsl.spec --noconfirm
      # A binary can link and still crash on start (a missing hidden import
      # only shows at runtime). Without this, a broken binary would ship
      # attached to the release and only the user would find out.
      - name: Smoke-test the binary (Unix)
        if: matrix.platform != 'windows'
        run: |
          ./dist/demodsl --help
          ./dist/demodsl capabilities > /dev/null
      - name: Smoke-test the binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          .\dist\demodsl.exe --help
          .\dist\demodsl.exe capabilities > $null
      - name: Package (Unix)
        if: matrix.platform != 'windows'
        run: |
          cd dist
          tar -czf "demodsl-${{ needs.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" demodsl
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path demodsl.exe -DestinationPath "demodsl-${{ needs.version.outputs.version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/demodsl-*

  upload-release-assets:
    needs: [build-binaries, version]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la artifacts/
          # --clobber so re-running a release job replaces the assets instead
          # of failing on "already exists".
          gh release upload "${{ env.VERSION_TAG }}" artifacts/* \
            --repo "${{ github.repository }}" --clobber

  # ── 5. Homebrew ──────────────────────────────────────────────────
  publish-homebrew:
    needs: [upload-release-assets, version, packaging]
    if: github.event_name == 'release' && needs.packaging.outputs.homebrew == 'true'
    runs-on: ubuntu-latest
    env:
      # A deploy key rather than a PAT: GitHub has no API to mint a personal
      # access token, and a deploy key is the narrower credential anyway —
      # write access to the tap repository only, instead of something that
      # acts as the account.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate formula from the released binaries
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_TAG }}"
          cp packaging/homebrew/demodsl.rb demodsl-formula.rb
          sed -i "s|__VERSION__|${VERSION}|g" demodsl-formula.rb
          for pair in "MACOS_ARM64:macos-aarch64" "MACOS_X86_64:macos-x86_64" "LINUX_X86_64:linux-x86_64"; do
            key="${pair%%:*}"; suffix="${pair##*:}"
            url="${BASE}/demodsl-${VERSION}-${suffix}.tar.gz"
            # curl -f so a missing asset fails the job: a formula pointing at
            # a 404 is worse than no formula, it breaks `brew install` for
            # everyone until the next release.
            sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
            sed -i -e "s|__URL_${key}__|${url}|" -e "s|__SHA_${key}__|${sha}|" demodsl-formula.rb
          done
          if grep -nE '__(URL|SHA|VERSION)' demodsl-formula.rb; then
            echo "::error::a placeholder was left unsubstituted in the formula"
            exit 1
          fi
          cat demodsl-formula.rb
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: demodsl-formula.rb
      - name: Push to homebrew-tap
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            # A silent skip is how the packaging jobs stayed broken for three
            # releases. Say it out loud instead. No backticks in this string:
            # inside double quotes the shell would run it as a command.
            echo "::warning::TAP_DEPLOY_KEY is not set - the tap still serves the previous version. The formula is attached to this run as the homebrew-formula artifact."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          # Create the file empty with 0600 first, so the key is never briefly
          # world-readable.
          install -m 600 /dev/null "$HOME/.ssh/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$HOME/.ssh/tap_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:Fran-cois/homebrew-demodsl.git tap
          cp demodsl-formula.rb tap/Formula/demodsl.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Nothing to do if the formula is byte-identical (a re-run).
          if git diff --cached --quiet; then
            echo "::notice::tap already up to date"
            exit 0
          fi
          git commit -m "demodsl ${VERSION}"
          git push

  # ── 6. Snap ──────────────────────────────────────────────────────
  publish-snap:
    needs: [version, packaging]
    if: github.event_name == 'release' && needs.packaging.outputs.snap == 'true'
    runs-on: ubuntu-latest
    env:
      SNAP_TOKEN: ${{ secrets.SNAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Update snap version
        run: |
          sed -i "s/^version:.*/version: \"${{ needs.version.outputs.version }}\"/" snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snap-build
      - uses: snapcore/action-publish@v1
        if: ${{ env.SNAP_TOKEN != '' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        with:
          snap: ${{ steps.snap-build.outputs.snap }}
          release: stable

  # ── 7. Scoop / Winget manifests ──────────────────────────────────
  update-package-managers:
    needs: [upload-release-assets, version, packaging]
    if: github.event_name == 'release' && needs.packaging.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute Windows SHA256
        id: win
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_TAG }}/demodsl-${{ needs.version.outputs.version }}-windows-x86_64.zip"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update Scoop manifest
        run: |
          cd packaging/scoop
          VERSION="${{ needs.version.outputs.version }}"
          sed -i \
            -e "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" \
            -e "s|v[0-9]*\.[0-9]*\.[0-9]*/demodsl-[0-9]*\.[0-9]*\.[0-9]*|v${VERSION}/demodsl-${VERSION}|g" \
            -e "s/__SHA256__/${{ steps.win.outputs.sha256 }}/" \
            demodsl.json

      - name: Update Winget manifest
        run: |
          cd packaging/winget
          sed -i \
            -e "s/PackageVersion: .*/PackageVersion: \"${{ needs.version.outputs.version }}\"/" \
            -e "s|__INSTALLER_URL__|${{ steps.win.outputs.url }}|" \
            -e "s|__INSTALLER_SHA256__|${{ steps.win.outputs.sha256 }}|" \
            Fran-cois.demodsl.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: package-manager-manifests
          path: |
            packaging/scoop/demodsl.json
            packaging/winget/Fran-cois.demodsl.yaml
      # To auto-submit Winget, uncomment:
      # - name: Submit to winget-pkgs
      #   uses: vedantmgoyal9/winget-releaser@main
      #   with:
      #     identifier: Fran-cois.demodsl
      #     token: ${{ secrets.WINGET_TOKEN }}

  # ── 8. VS Code Extension ────────────────────────────────────────
  publish-vscode:
    needs: [publish-pypi, version, packaging]
    if: github.event_name == 'release' && needs.packaging.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install
      - name: Sync version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run compile
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
      - name: Publish to Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --no-dependencies -p "${{ env.VSCE_PAT }}"
