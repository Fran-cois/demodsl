# Phase 10 — Per-layer 3D rotation (stylized "card flip" & tilt)
# ----------------------------------------------------------------
# Phase 8 gave layers a Z position and a scene camera. Phase 10 adds a true
# 3D ROTATION to any layer via `transform.rotation_x` / `transform.rotation_y`
# (degrees) — no `camera_3d` required. Each sprite is warped through a
# pin-hole perspective (using the scene camera's focal length when present,
# otherwise a sane built-in default) and given a subtle directional shading
# as the face turns away, so a flat text/shape/image layer reads as a lit
# 3D card instead of a squashed picture.
#
#   • `rotation_x` tips the TOP edge away from camera (nod "yes")
#   • `rotation_y` tips the RIGHT edge away from camera (shake "no" /
#     the classic left-right card flip)
#   • Both compose with `parent` just like position/scale/rotation, so a
#     label parented to a swinging panel tilts along with it for free.
#
# Demonstrated below:
#   1) Three "hover-tilt" UI cards wobbling on both axes (modern web trend)
#   2) A 3-panel "cube reveal" swinging open from edge-on to face-on,
#      each with a caption PARENTED to its panel
#   3) A logo doing a full continuous spin on rotation_y (a deliberately
#      simplified single-sided "coin spin" — there is no back texture, so
#      past 90° the front face is seen mirrored; fine for a stylized loop)

metadata:
  title: "AE Phase 10 — 3D layer rotation (card flip & tilt)"
  description: "Per-layer rotation_x/rotation_y perspective warp with directional shading"
  version: "1.0"

scenarios:
  - name: "phase10"
    url: "https://fran-cois.github.io/demodsl/"
    browser: "chrome"
    viewport: { width: 1920, height: 1080 }

    steps:
      - action: navigate
        url: "https://fran-cois.github.io/demodsl/"
        wait: 1.5
      - action: scroll
        direction: down
        pixels: 300
        wait: 7.0
      - action: scroll
        direction: up
        pixels: 300
        wait: 7.5

    timeline:
      fps: 30

      layers:
        # ── Intro title ──────────────────────────────────────────────────
        - id: intro_title
          type: text
          content: "3D LAYERS"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 88
          color: "#F8FAFC"
          start: 0.0
          duration: 2.2
          transform:
            position: [960, 160]
            opacity: 0.0
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0, ease: ease-out }
                - { t: 0.5, v: 1.0 }
                - { t: 1.7, v: 1.0, ease: ease-in }
                - { t: 2.2, v: 0.0 }

        # ── 1) Hover-tilt cards — subtle continuous wobble ────────────────
        - id: tilt_card_left
          type: shape
          shape: rectangle
          width: 320
          height: 220
          fill: "#1E293B"
          stroke: "#38BDF8"
          stroke_width: 4
          corner_radius: 20
          start: 0.5
          duration: 4.0
          transform:
            position: [420, 480]
          animators:
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 1.0, v: -34.0 }
                - { t: 2.0, v: 20.0 }
                - { t: 3.0, v: -26.0 }
                - { t: 4.0, v: 0.0 }
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 1.0, v: 40.0 }
                - { t: 2.0, v: -30.0 }
                - { t: 3.0, v: 26.0 }
                - { t: 4.0, v: 0.0 }

        - id: tilt_card_left_label
          type: text
          content: "TILT"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 40
          color: "#F8FAFC"
          start: 0.5
          duration: 4.0
          parent: tilt_card_left
          transform:
            position: [420, 480]

        - id: tilt_card_mid
          type: shape
          shape: rectangle
          width: 320
          height: 220
          fill: "#1E293B"
          stroke: "#A78BFA"
          stroke_width: 4
          corner_radius: 20
          start: 0.8
          duration: 4.0
          transform:
            position: [960, 480]
          animators:
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 22.0 }
                - { t: 1.2, v: -30.0 }
                - { t: 2.4, v: 26.0 }
                - { t: 3.6, v: -14.0 }
                - { t: 4.0, v: 0.0 }
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: -38.0 }
                - { t: 1.2, v: 34.0 }
                - { t: 2.4, v: -26.0 }
                - { t: 3.6, v: 18.0 }
                - { t: 4.0, v: 0.0 }

        - id: tilt_card_mid_label
          type: text
          content: "TURN"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 40
          color: "#F8FAFC"
          start: 0.8
          duration: 4.0
          parent: tilt_card_mid
          transform:
            position: [960, 480]

        - id: tilt_card_right
          type: shape
          shape: rectangle
          width: 320
          height: 220
          fill: "#1E293B"
          stroke: "#F472B6"
          stroke_width: 4
          corner_radius: 20
          start: 1.1
          duration: 4.0
          transform:
            position: [1500, 480]
          animators:
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: -26.0 }
                - { t: 1.0, v: 30.0 }
                - { t: 2.0, v: -18.0 }
                - { t: 3.0, v: 22.0 }
                - { t: 4.0, v: 0.0 }
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: 32.0 }
                - { t: 1.0, v: -40.0 }
                - { t: 2.0, v: 28.0 }
                - { t: 3.0, v: -20.0 }
                - { t: 4.0, v: 0.0 }

        - id: tilt_card_right_label
          type: text
          content: "TIP"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 40
          color: "#F8FAFC"
          start: 1.1
          duration: 4.0
          parent: tilt_card_right
          transform:
            position: [1500, 480]

        # ── 2) Cube reveal — three panels swing open, edge-on → face-on ──
        # Each panel starts at rotation_y = ±85° (edge-on sliver, but short of
        # the ±90° flip point where the mirrored back would show) and swings
        # to 0° (flat, facing camera) over a slow 2.2s so the perspective
        # trapezoid is clearly visible while playing. The caption is
        # PARENTED to its panel so it tilts along for free.
        - id: cube_panel_a
          type: shape
          shape: rectangle
          width: 360
          height: 460
          fill: "#0EA5E9"
          corner_radius: 12
          start: 5.2
          duration: 4.2
          transform:
            position: [560, 620]
            rotation_y: -85.0
          animators:
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: -85.0, ease: ease-out }
                - { t: 2.2, v: 0.0, ease: ease-in-out }
                - { t: 4.2, v: 0.0 }

        - id: cube_panel_a_label
          type: text
          content: "OPEN"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 48
          color: "#F8FAFC"
          start: 5.2
          duration: 4.2
          parent: cube_panel_a
          transform:
            position: [560, 620]

        - id: cube_panel_b
          type: shape
          shape: rectangle
          width: 360
          height: 460
          fill: "#22C55E"
          corner_radius: 12
          start: 5.9
          duration: 4.2
          transform:
            position: [960, 620]
            rotation_y: 85.0
          animators:
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: 85.0, ease: ease-out }
                - { t: 2.2, v: 0.0, ease: ease-in-out }
                - { t: 4.2, v: 0.0 }

        - id: cube_panel_b_label
          type: text
          content: "SESAME"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 44
          color: "#0B1220"
          start: 5.9
          duration: 4.2
          parent: cube_panel_b
          transform:
            position: [960, 620]

        - id: cube_panel_c
          type: shape
          shape: rectangle
          width: 360
          height: 460
          fill: "#F59E0B"
          corner_radius: 12
          start: 6.6
          duration: 4.2
          transform:
            position: [1360, 620]
            rotation_y: -85.0
          animators:
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: -85.0, ease: ease-out }
                - { t: 2.2, v: 0.0, ease: ease-in-out }
                - { t: 4.2, v: 0.0 }

        - id: cube_panel_c_label
          type: text
          content: "REVEAL"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 40
          color: "#0B1220"
          start: 6.6
          duration: 4.2
          parent: cube_panel_c
          transform:
            position: [1360, 620]

        # ── 3) Continuous spin loop — full rotation_y sweep ───────────────
        # A plain circle would look identical at every angle (no visible
        # cue), so this is a rounded square with a label — the corners and
        # text foreshorten as it turns, making the spin unmistakable.
        - id: spin_logo
          type: shape
          shape: rectangle
          width: 260
          height: 260
          fill: "#7C3AED"
          stroke: "#C4B5FD"
          stroke_width: 6
          corner_radius: 28
          start: 11.0
          duration: 4.2
          transform:
            position: [960, 900]
          animators:
            - property: rotation_y
              keyframes:
                - { t: 0.0, v: 0.0, ease: linear }
                - { t: 4.2, v: 360.0, ease: linear }

        - id: spin_logo_label
          type: text
          content: "SPIN"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 40
          color: "#F8FAFC"
          start: 11.0
          duration: 4.2
          parent: spin_logo
          transform:
            position: [960, 900]

pipeline:
  - composite_timeline: {}

