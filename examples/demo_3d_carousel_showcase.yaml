# 3D Carousel showcase — a coverflow-style ring of the Phase 10 stylized
# 3D card effects (TILT, FLIP, CUBE, SPIN, DEPTH, PARALLAX), all driven by
# nothing more than plain keyframed position_x / position_z / rotation_y.
#
# Each card orbits around a fixed pin-hole camera (Phase 8): as it swings to
# the front it centers, grows (perspective) and flattens to face-on
# (rotation_y -> 0); as it swings to the side it shrinks, moves off-centre
# and tilts edge-on (rotation_y -> +/-90); at the back it's small, dim (the
# Phase 10 shading falloff) and briefly shows a mirrored face (rotation_y
# near +/-180) — exactly like a real Cover-Flow / carousel widget, just
# generated from 6 keyframed layers, no camera orbit needed.
#
# The keyframe arrays below were generated (not hand-authored) from:
#   angle_k(t) = 2*pi*(k/6) + 2*pi*t/6.0
#   position_x = 960.0 + 520.0*sin(angle)
#   position_z = 0.0 + 520.0*cos(angle)
#   rotation_y = 180 - degrees(angle)

metadata:
  title: "3D Carousel — stylized effects showcase"
  description: "Coverflow-style 3D ring of labeled cards (Phase 8 camera + Phase 10 per-layer rotation)"
  version: "1.0"

scenarios:
  - name: "carousel"
    url: "https://fran-cois.github.io/demodsl/"
    browser: "chrome"
    viewport: { width: 1920, height: 1080 }

    steps:
      - action: navigate
        url: "https://fran-cois.github.io/demodsl/"
        wait: 1.5
      - action: scroll
        direction: down
        pixels: 200
        wait: 6.0
      - action: scroll
        direction: up
        pixels: 200
        wait: 6.5

    timeline:
      fps: 30

      camera_3d:
        position: [960.0, 560.0, -1300.0]
        focal_length: 1100.0

      layers:
        - id: intro_title
          type: text
          content: "3D CAROUSEL"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 72
          color: "#F8FAFC"
          start: 0.0
          duration: 2.0
          transform:
            position: [960, 150]
            opacity: 0.0
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0, ease: ease-out }
                - { t: 0.5, v: 1.0 }
                - { t: 1.5, v: 1.0, ease: ease-in }
                - { t: 2.0, v: 0.0 }

