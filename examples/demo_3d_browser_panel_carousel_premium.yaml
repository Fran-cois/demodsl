      corner_radius: 14
      start: 63.2
      duration: 3.7
      transform:
        position:
        - 960
        - 580
      animators:
      - property: scale
        keyframes:
        - t: 0
          v: 0.7
        - t: 0.4
          v: 1.05
          ease: spring
        - t: 0.6
          v: 1.0
      - property: opacity
        keyframes:
        - t: 0
          v: 0
        - t: 0.3
          v: 1
        - t: 3.4
          v: 1
        - t: 3.7
          v: 0
    - id: cta_button_text_2
      type: text
      content: Try Prism free →
      font_size: 34
      font_family: Inter
      color: '#FFFFFF'
