        keyframes:
        - t: 0.0
          v: 0.0
        - t: 0.6
          v: 1.0
          ease: ease-out
    - id: brand_badge_dot
      type: shape
      shape: ellipse
      width: 14
      height: 14
      fill: '#7C3AED'
      start: 0.0
      duration: 80.0
      transform:
        position:
        - 58
        - 60
        opacity: 0.0
      animators:
      - property: opacity
        keyframes:
        - t: 0.0
          v: 0.0
        - t: 0.6
          v: 1.0
          ease: ease-out
    - id: brand_badge_text
      type: text
      content: PRISM
      font_family: Inter
      font_weight: bold
      font_size: 26
      color: '#F8FAFC'
      start: 0.0
      duration: 80.0
      transform:
        position:
        - 80
        - 60
        anchor:
        - 0.0
        - 0.5
        opacity: 0.0
      animators:
      - property: opacity
        keyframes:
