    - id: end_bg_2
      type: shape
      shape: rectangle
      fill: '#0F172A'
      width: 1920
      height: 1080
      start: 62.4
      duration: 4.5
      transform:
        position:
        - 960
        - 540
      animators:
      - property: opacity
        keyframes:
        - t: 0
          v: 0
        - t: 0.4
          v: 1
          ease: ease-out
        - t: 4.2
          v: 1
        - t: 4.5
          v: 0
    - id: end_headline_2
      type: text
      content: Make every demo feel premium.
      font_size: 72
      font_family: Inter
      color: '#FFFFFF'
      start: 62.8
      duration: 4.1
      transform:
        position:
        - 960
        - 420
      animators:
      - property: position_y
        keyframes:
        - t: 0
