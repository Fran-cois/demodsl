            intensity: 0.6

      # 4. Chart Draw
      - action: "scroll"
        direction: "up"
        pixels: 430
        narration: "Chart Draw effect."
        wait: 2.5
        effects:
          - type: "chart_draw"
            color: "#22d3ee"
            intensity: 0.8

      # 5. Click Particles
      - action: "scroll"
        direction: "down"
        pixels: 250
        narration: "Click Particles effect."
        wait: 2.5
        effects:
          - type: "click_particles"
            color: "#a855f7"
            intensity: 0.8

      # 6. Click Ripple
      - action: "scroll"
        direction: "down"
        pixels: 310
        narration: "Click Ripple effect."
        wait: 2.5
        effects:
          - type: "click_ripple"
            color: "#6366f1"
            intensity: 0.8

      # 7. Connection Trace
      - action: "scroll"
        direction: "down"
        pixels: 370
        narration: "Connection Trace effect."
        wait: 2.5
        effects:
          - type: "connection_trace"
            from_x: 0.2
            from_y: 0.3
            target_x: 0.8
            target_y: 0.7
