# Granit — native brand theme demo
# ---------------------------------
# Reproduces GRANIT'S OWN real getgranit.ai theme, extracted live from the
# site's computed styles:
#   - bg #FFFFFF · ink #0F0C08 · body #3A342D
#   - accent #D4583A (terracotta), gradient #FF8A6A -> #D4583A
#   - borders #D4CDB9 · pills fully rounded
#   - real hero uses Libre Caslon Text serif (regular black line + italic
#     terracotta line) -> Georgia / Georgia Italic locally, same spirit.
#
# Three acts:
#   1. 0-6.6s   branded intro card, per-char headline reveal, 3D flip-away
#   2. 6.6-18s  guided tour of the REAL captured site, with live browser
#               effects injected into the page (zoom focus, cursor trail,
#               toast, shimmer, spotlight, bloom, grain) + a lower third
#   3. 18-24s   outro CTA card wiped in from the right, animated counters

metadata:
  title: "Granit — Native Theme Demo"
  description: "Branded intro, live site tour with injected effects, outro CTA — all in Granit's real theme"
  version: "3.0"

# Single source of truth: these tokens are pushed into every effect that
# declares them (toast chrome, cursor trail, ...) by apply_theme(), so the
# injected overlays match the timeline cards without repeating hex codes.
theme:
  accent: "#D4583A"
  ink: "#0F0C08"
  surface: "#FFFFFF"
  font: "Inter"

scenarios:
  - name: "granit_native_theme"
    url: "https://getgranit.ai"
    browser: "chrome"
    viewport: { width: 1920, height: 1080 }

    steps:
      # Act 1 + reveal — intro card covers most of this step
      - action: navigate
        url: "https://getgranit.ai"
        wait: 7.5
        effects:
          - type: "light_leak"
            color: "#FF8A6A"
            intensity: 0.35
            speed: 0.6

      # Act 2 — guided tour with live injected effects
      - action: scroll
        direction: down
        pixels: 600
        wait: 3.5
        effects:
          - type: "zoom_focus"
            scale: 1.12
            target_x: 0.5
            target_y: 0.45
          - type: "cursor_trail_glow"
            simulate_mouse: true

      - action: scroll
        direction: down
        pixels: 700
        wait: 3.5
        effects:
          - type: "notification_toast"
            position: "top-right"
            notifications:
              - app: "Granit"
                title: "Tiers-payant envoyé"
                body: "14 dossiers transmis à la CPAM · 0 rejet détecté"
                delay: 300
              - app: "Granit"
                title: "Facturation validée"
                body: "Lot 2026-08 · 2 296 € facturés automatiquement"
                color: "#5C9E6B"
                delay: 1400
              - app: "Granit"
                title: "Relance mutuelle traitée"
                body: "3 impayés relancés · réconciliation bancaire à jour"
                delay: 2500
          - type: "ui_shimmer"
            color: "#FF8A6A"
            intensity: 0.4

      - action: scroll
        direction: down
        pixels: 700
        wait: 3.5
        effects:
          - type: "spotlight"
            intensity: 0.55
          - type: "click_ripple"
            intensity: 0.6

      # Act 3 — back to top under the outro card
      - action: scroll
        direction: up
        pixels: 2000
        wait: 6.0
        effects:
          - type: "bloom"
            intensity: 0.35
          - type: "film_grain"
            intensity: 0.22

    timeline:
      fps: 30
      layers:
        # ══════════ ACT 1 — intro card (3D flip-away exit) ══════════
        - id: bg_card
          type: shape
          shape: rectangle
          width: 1920
          height: 1080
          fill: "#FFFFFF"
          start: 0.0
          duration: 24.0
          transform: { position: [960, 540], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.25, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.0, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }
            - property: scale
              keyframes:
                - { t: 0.0, v: 1.0 }
                - { t: 5.5, v: 1.0, ease: ease-in }
                - { t: 6.5, v: 1.05 }

        - id: blob_glow_a
          type: shape
          shape: ellipse
          width: 900
          height: 900
          fill: "#FF8A6A40"
          start: 0.0
          duration: 24.0
          transform: { position: [1560, 260], opacity: 0.0 }
          masks:
            - { shape: ellipse, bounds: [0.0, 0.0, 1.0, 1.0], feather: 220, inverted: false }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.3, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: position
              keyframes:
                - { t: 0.0, v: [1560, 260], ease: ease-in-out }
                - { t: 5.5, v: [1510, 310] }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: blob_glow_b
          type: shape
          shape: ellipse
          width: 700
          height: 700
          fill: "#D4583A33"
          start: 0.0
          duration: 24.0
          transform: { position: [1360, 480], opacity: 0.0 }
          masks:
            - { shape: ellipse, bounds: [0.0, 0.0, 1.0, 1.0], feather: 180, inverted: false }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.4, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: position
              keyframes:
                - { t: 0.0, v: [1360, 480], ease: ease-in-out }
                - { t: 5.5, v: [1405, 435] }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: label_native
          type: text
          content: "P L A T E F O R M E   D ' A G E N T S   I A   P O U R   L A   S A N T É"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 20
          color: "#D4583A"
          align: "left"
          start: 0.0
          duration: 24.0
          transform: { position: [140, 300], anchor: [0.0, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.6, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: position
              keyframes:
                - { t: 0.15, v: [140, 334], ease: ease-out }
                - { t: 0.65, v: [140, 300] }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        # Per-character reveal on both headline lines
        - id: title_line1
          type: text
          content: "Vos équipes soignent."
          font_family: "Georgia"
          font_weight: "normal"
          font_size: 66
          color: "#0F0C08"
          align: "left"
          start: 0.0
          duration: 24.0
          transform: { position: [140, 400], anchor: [0.0, 0.5], opacity: 0.0 }
          animator:
            char_delay: 0.028
            offset_y:
              - { t: 0.0, v: 30.0, ease: ease-out }
              - { t: 0.4, v: 0.0 }
            opacity:
              - { t: 0.0, v: 0.0 }
              - { t: 0.3, v: 1.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.55, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: title_line2
          type: text
          content: "Granit gère le reste."
          font_family: "Georgia Italic"
          font_weight: "normal"
          font_size: 66
          color: "#D4583A"
          align: "left"
          start: 0.0
          duration: 24.0
          transform: { position: [140, 478], anchor: [0.0, 0.5], opacity: 0.0 }
          animator:
            char_delay: 0.028
            offset_y:
              - { t: 0.0, v: 30.0, ease: ease-out }
              - { t: 0.4, v: 0.0 }
            opacity:
              - { t: 0.0, v: 0.0 }
              - { t: 0.3, v: 1.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.9, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        # Underline drawn beneath the italic line
        - id: title_underline
          type: polyline
          points: [[142, 520], [700, 520]]
          stroke: "#D4583A"
          stroke_width: 3
          start: 0.0
          duration: 24.0
          trim_end_kfs:
            - { t: 1.3, v: 0.0 }
            - { t: 2.1, v: 1.0, ease: ease-out }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.3, v: 0.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: paragraph_native
          type: text
          content: "Granit se branche sur votre logiciel métier et exécute vos tâches\nadministratives à votre place : tiers-payant, facturation, relances.\nSans intégration technique. Opérationnel en 48h."
          font_family: "Inter"
          font_weight: "normal"
          font_size: 25
          color: "#3A342D"
          align: "left"
          start: 0.0
          duration: 24.0
          transform: { position: [140, 620], anchor: [0.0, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 2.0, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: position
              keyframes:
                - { t: 1.5, v: [140, 654], ease: ease-out }
                - { t: 2.05, v: [140, 620] }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: diamond_native
          type: shape
          shape: rectangle
          width: 20
          height: 20
          fill: "#D4583A"
          start: 0.0
          duration: 24.0
          transform: { position: [150, 710], rotation: 45, opacity: 0.0, scale: 0.2 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 2.3, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: scale
              keyframes:
                - { t: 2.2, v: 0.2, ease: spring }
                - { t: 2.6, v: 1.0 }
            - property: rotation
              keyframes:
                - { t: 2.2, v: 45.0, ease: ease-out }
                - { t: 3.0, v: 405.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: cta_primary_bg
          type: shape
          shape: rectangle
          width: 470
          height: 84
          corner_radius: 42
          fill: "#D4583A"
          start: 0.0
          duration: 24.0
          transform: { position: [140, 790], anchor: [0.0, 0.5], opacity: 0.0, scale: 0.94 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 2.6, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: scale
              keyframes:
                - { t: 0.0, v: 0.94, ease: spring }
                - { t: 2.9, v: 1.0 }
                - { t: 5.5, v: 1.0, ease: ease-in }
                - { t: 6.5, v: 1.05 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: cta_primary_label
          type: text
          content: "Demander une démo gratuite ->"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 25
          color: "#FFFFFF"
          start: 0.0
          duration: 24.0
          transform: { position: [375, 790], anchor: [0.5, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 2.7, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: cta_secondary_bg
          type: shape
          shape: rectangle
          width: 330
          height: 84
          corner_radius: 42
          fill: "#FFFFFF"
          stroke: "#D4CDB9"
          stroke_width: 2
          start: 0.0
          duration: 24.0
          transform: { position: [634, 790], anchor: [0.0, 0.5], opacity: 0.0, scale: 0.94 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 2.9, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: scale
              keyframes:
                - { t: 0.0, v: 0.94, ease: spring }
                - { t: 3.2, v: 1.0 }
                - { t: 5.5, v: 1.0, ease: ease-in }
                - { t: 6.5, v: 1.05 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        - id: cta_secondary_label
          type: text
          content: "Découvrir les agents"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 25
          color: "#0F0C08"
          start: 0.0
          duration: 24.0
          transform: { position: [799, 790], anchor: [0.5, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 3.0, v: 1.0 }
                - { t: 5.5, v: 1.0 }
                - { t: 6.5, v: 0.0 }
            - property: rotation_x
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 5.5, v: 0.0, ease: ease-in }
                - { t: 6.6, v: -82.0 }

        # ══════════ ACT 2 — lower third over the live site ══════════
        - id: lt_bar
          type: shape
          shape: rectangle
          width: 8
          height: 96
          fill: "#D4583A"
          start: 8.0
          duration: 8.5
          transform: { position: [140, 900], anchor: [0.0, 0.5], opacity: 0.0, scale: 0.3 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.3, v: 1.0 }
                - { t: 8.0, v: 1.0 }
                - { t: 8.5, v: 0.0 }
            - property: scale
              keyframes:
                - { t: 0.0, v: 0.3, ease: spring }
                - { t: 0.5, v: 1.0 }

        - id: lt_plate
          type: shape
          shape: rectangle
          width: 640
          height: 96
          corner_radius: 10
          fill: "#FFFFFFEE"
          start: 8.0
          duration: 8.5
          transform: { position: [156, 900], anchor: [0.0, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.45, v: 1.0 }
                - { t: 8.0, v: 1.0 }
                - { t: 8.5, v: 0.0 }
            - property: position
              keyframes:
                - { t: 0.2, v: [96, 900], ease: ease-out }
                - { t: 0.7, v: [156, 900] }

        - id: lt_title
          type: text
          content: "Le vrai produit, en conditions réelles"
          font_family: "Georgia"
          font_weight: "normal"
          font_size: 32
          color: "#0F0C08"
          align: "left"
          start: 8.0
          duration: 8.5
          transform: { position: [186, 884], anchor: [0.0, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.7, v: 1.0 }
                - { t: 8.0, v: 1.0 }
                - { t: 8.4, v: 0.0 }

        - id: lt_sub
          type: text
          content: "getgranit.ai · tiers-payant, facturation, relances"
          font_family: "Inter"
          font_weight: "normal"
          font_size: 20
          color: "#7A7368"
          align: "left"
          start: 8.0
          duration: 8.5
          transform: { position: [187, 921], anchor: [0.0, 0.5], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.9, v: 1.0 }
                - { t: 8.0, v: 1.0 }
                - { t: 8.4, v: 0.0 }

        # ══════════ ACT 3 — outro card, wiped in from the right ══════════
        # A terracotta band sweeps across first, the white card follows it.
        - id: wipe_lead
          type: shape
          shape: rectangle
          width: 1920
          height: 1080
          fill: "#FF8A6A"
          start: 17.6
          duration: 10.4
          transform: { position: [2880, 540], opacity: 1.0 }
          animators:
            - property: position
              keyframes:
                - { t: 0.0, v: [2880, 540], ease: ease-in-out }
                - { t: 0.55, v: [-960, 540] }

        - id: outro_bg
          type: shape
          shape: rectangle
          width: 1920
          height: 1080
          fill: "#FFFFFF"
          start: 17.6
          duration: 10.4
          transform: { position: [2880, 540], opacity: 1.0 }
          animators:
            - property: position
              keyframes:
                - { t: 0.12, v: [2880, 540], ease: ease-in-out }
                - { t: 0.7, v: [960, 540] }

        - id: outro_glow
          type: shape
          shape: ellipse
          width: 1100
          height: 1100
          fill: "#FF8A6A38"
          start: 18.2
          duration: 9.8
          transform: { position: [1620, 760], opacity: 0.0 }
          masks:
            - { shape: ellipse, bounds: [0.0, 0.0, 1.0, 1.0], feather: 260, inverted: false }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.5, v: 1.0 }
            - property: position
              keyframes:
                - { t: 0.0, v: [1700, 820], ease: ease-out }
                - { t: 9.8, v: [1520, 660] }

        - id: outro_title
          type: text
          content: "Granit"
          font_family: "Georgia"
          font_weight: "normal"
          font_size: 96
          color: "#0F0C08"
          start: 18.3
          duration: 9.7
          transform: { position: [960, 330], opacity: 0.0, scale: 0.92 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0, ease: ease-out }
                - { t: 0.45, v: 1.0 }
            - property: scale
              keyframes:
                - { t: 0.0, v: 0.92, ease: ease-out }
                - { t: 0.6, v: 1.0 }

        - id: outro_sub
          type: text
          content: "Vos équipes soignent. Granit gère le reste."
          font_family: "Georgia Italic"
          font_weight: "normal"
          font_size: 34
          color: "#D4583A"
          start: 18.5
          duration: 9.5
          transform: { position: [960, 412], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.5, v: 1.0 }

        # Animated stat counters (real product KPIs)
        - id: stat_a_value
          type: text
          content: "0"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 76
          color: "#D4583A"
          start: 18.9
          duration: 9.1
          transform: { position: [640, 590], opacity: 0.0 }
          counter: { from_value: 0.0, to_value: -90.0, start: 0.2, duration: 1.3, format: "{value:.0f}%" }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.3, v: 1.0 }

        - id: stat_a_label
          type: text
          content: "de rejets CPAM"
          font_family: "Inter"
          font_weight: "normal"
          font_size: 23
          color: "#3A342D"
          start: 18.9
          duration: 9.1
          transform: { position: [640, 655], opacity: 0.0 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.6, v: 1.0 }

        - id: stat_divider
          type: shape
          shape: rectangle
          width: 2
          height: 110
          fill: "#D4CDB9"
          start: 18.9
          duration: 9.1
          transform: { position: [960, 615], opacity: 0.0, scale: 0.2 }
          animators:
            - property: opacity
              keyframes:
                - { t: 0.0, v: 0.0 }
                - { t: 0.4, v: 1.0 }
            - property: scale
              keyframes:
                - { t: 0.2, v: 0.2, ease: ease-out }
                - { t: 0.8, v: 1.0 }

        - id: stat_b_value
          type: text
          content: "0"
          font_family: "Inter"
          font_weight: "bold"
          font_size: 76
